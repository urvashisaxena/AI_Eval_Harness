[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalharness"
version = "0.1.0"
description = "AI eval / governance harness: LLM-as-judge scorecards, RAGAS metrics, hallucination rate, regression tracking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
evalharness = "evalharness.cli:main"

[tool.setuptools.packages.find]
include = ["evalharness*"]
